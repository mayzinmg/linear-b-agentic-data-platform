version: 2

models:
  - name: silver_linear_b_tablets
    description: "Cleaned and deduplicated tablet-level Linear B records from the InsiderPhD source."
    columns:
      - name: tablet_id
        tests:
          - not_null
      - name: site_code
        tests:
          - not_null
      - name: tablet_series
        tests:
          - not_null

  - name: silver_damos_tokens
    description: "Cleaned token-level records from the DĀMOS search-result snapshot."
    columns:
      - name: tablet_id
        tests:
          - not_null
      - name: tablet_key
        tests:
          - not_null
      - name: source_snapshot_date
        tests:
          - not_null
      - name: source_system
        tests:
          - not_null

  - name: gold_tablet_damos_enrichment
    description: "Combined enrichment table linking InsiderPhD tablet records with DĀMOS token-level summaries."
    columns:
      - name: insider_tablet_id
        tests:
          - not_null
      - name: tablet_key
        tests:
          - not_null
      - name: damos_match_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'not_matched']